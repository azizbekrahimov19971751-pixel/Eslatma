name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Ilova fayllarini yaratish
        run: |
          mkdir -p www
          cat > www/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="uz">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
          <title>Eslatma</title>
          </head>
          <body>
          <h1>Eslatma ilovasi</h1>
          </body>
          </html>
          HTMLEOF

      - name: Cordova o'rnatish va APK yig'ish
        run: |
          npm install -g cordova
          cordova create myApp com.eslatma.app Eslatma
          cd myApp
          cp -r ../www/* www/
          cordova platform add android
          cordova build android --verbose

      - name: APK faylni yuklab olish uchun saqlash
        uses: actions/upload-artifact@v4
        with:
          name: Eslatma-App-APK
          path: myApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          
