name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cordova o'rnatish va loyihani yig'ish
        run: |
          npm install -g cordova
          cordova create myApp com.eslatma.app Eslatma
          cd myApp
          cp -r ../* www/ 2>/dev/null || true
          cordova platform add android
          cordova build android --verbose

      - name: APK faylni saqlash
        uses: actions/upload-artifact@v4
        with:
          name: Eslatma-App-APK
          path: myApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          
