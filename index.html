<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>Eslatma</title>
<style>
html{background:#0b0d12}
:root{--bg:#0b0d12;--card:#141821;--card2:#10131a;--tx:#f3efe6;--mut:#8d93a1;--gold:#d8b45f;--gold2:#f2d98f;--bd:#262c38;--red:#ef6b6b;--green:#6fcf97;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(1200px 500px at 50% -200px,#1b2030 0,var(--bg) 70%) fixed;color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding-top:env(safe-area-inset-top)}
header{display:flex;justify-content:space-between;align-items:center;padding:22px 18px 8px;max-width:600px;margin:auto}
h1{font:600 30px/1 Georgia,serif;margin:0;background:linear-gradient(90deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
header small{display:block;color:var(--mut);margin-top:6px;font-size:13px}
button{font:inherit;cursor:pointer;border-radius:14px;padding:11px 16px;background:var(--card);color:var(--tx);border:1px solid var(--bd);touch-action:manipulation}
button.p{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#2a2008;border:0;font-weight:700}
button.d{color:var(--red)}
#bSet{width:46px;height:46px;padding:0;border-radius:50%;border-color:#d8b45f55;color:var(--gold)}
main{padding:8px 16px 130px;max-width:600px;margin:auto}
h2{font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin:22px 4px 10px;opacity:.85}
.chip{font-size:11px;letter-spacing:1px;text-transform:uppercase;padding:3px 9px;border-radius:20px;border:1px solid #d8b45f55;color:var(--gold)}
.amt{font:700 16px Georgia,serif;color:var(--gold2)}
.bar{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 35%);padding:26px 14px calc(14px + env(safe-area-inset-bottom));display:flex;gap:10px;max-width:600px;margin:auto;z-index:30}
.bar input{flex:1;min-width:0;border-radius:26px;padding:15px 20px;border-color:#d8b45f44;background:#0e1118;color:var(--tx);font:inherit;border:1px solid var(--bd)}
.bar button{border-radius:26px;padding:0 24px}
.fbar{flex-direction:column;gap:10px}
.fbar .r{display:flex;gap:10px}
.fbar .r>*{flex:1;min-width:0}
.fbar button{padding:14px;border-radius:22px}
.fbar .typeBtn{color:var(--mut)}
.fbar .typeBtn.on{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#2a2008;border:0;font-weight:700}
input,select{font:inherit;width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--bd);background:#0e1118;color:var(--tx)}
input:focus,select:focus{outline:0;border-color:var(--gold)}
dialog{border:1px solid #d8b45f44;border-radius:24px;padding:22px;width:min(92vw,420px);background:linear-gradient(160deg,#171c27,#0f1219);color:var(--tx);box-shadow:0 30px 80px #000c}
dialog::backdrop{background:rgba(0,0,0,.75)}
dialog[open]{z-index:9999}
dialog h3{margin:0;font:600 22px Georgia,serif;color:var(--gold2)}
dialog label{display:block;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);margin:14px 0 6px}
.row{display:flex;gap:8px;margin-top:16px}.row button{flex:1}
.empty{color:var(--mut);text-align:center;padding:60px 20px;line-height:1.7}
.empty b{display:block;font:600 22px Georgia,serif;color:var(--gold);margin-bottom:6px}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:linear-gradient(135deg,var(--gold2),var(--gold));color:#2a2008;font-weight:600;padding:12px 18px;border-radius:16px;display:none;z-index:9999;max-width:90vw}
[hidden]{display:none!important}
.tabs{display:flex;gap:8px;max-width:600px;margin:10px auto 4px;padding:0 16px}
.tabs button{flex:1;color:var(--mut);border-radius:16px}
.tabs button.on{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#2a2008;border:0;font-weight:700}
header.hd{position:sticky;top:0;z-index:40;display:block;max-width:none;margin:0;padding:10px 16px;background:#0a0a0ef2;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid #d4af3740}
.hdi{max-width:600px;margin:0 auto;display:flex;align-items:center;justify-content:center;position:relative;gap:10px}
.crest{width:38px;height:38px;border-radius:12px;background:#17171f;border:1px solid #d4af3766;display:flex;align-items:center;justify-content:center;font:700 20px Georgia,serif;color:var(--gold2)}
.hdt h1{font:800 17px/1 Georgia,serif;letter-spacing:2px}
.hdt small{display:block;margin:4px 0 0;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#a0a0a8}
header.hd #bSet{position:absolute;right:0;top:0;width:38px;height:38px}
header.hd .tabs{max-width:600px;margin:10px auto 0;padding:4px;gap:4px;background:#121217;border:1px solid #d4af3733;border-radius:16px}
.tabs button{border:0;background:transparent;border-radius:12px;padding:9px 6px;font-weight:600;color:#a0a0a8}
.tabs button.on{color:#0a0a0d}
.bdg{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:99px;background:#000;color:#e8c45a;font-size:12px}
.nc{display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,#18181ee8,#0d0d11fa);border:1px solid #d4af3740;border-radius:18px;padding:12px;margin-bottom:12px;cursor:pointer;box-shadow:0 8px 30px #0009;touch-action:manipulation}
.nc.today{border-color:#e8c45a}.nc.over{border-color:#b9770e88;background:#1a120b}
.nc.fin{opacity:.6}.nc.fin .nt{text-decoration:line-through}
.nb{flex:0 0 68px;text-align:center;padding:9px 2px;border-radius:14px;background:#0e0e14;border:1px solid #d4af3744}
.nb strong{display:block;font:800 28px/1 Georgia,serif;background:linear-gradient(135deg,#fff4c2,#e6c252 45%,#b88b16 80%,#f5d36b);-webkit-background-clip:text;background-clip:text;color:transparent}
.nb.w strong{font-size:17px;padding:5px 0}
.nb.o strong{background:none;color:#fbbf24;-webkit-text-fill-color:#fbbf24}
.nb span{display:block;margin-top:5px;font-size:9px;letter-spacing:.5px;text-transform:uppercase;color:#a5a5b2}
.nm{flex:1;min-width:0}
.nr{display:flex;gap:8px;align-items:center;margin-bottom:4px}
.nt{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nd{font-size:12px;color:var(--mut);margin-top:2px}
.hero{background:linear-gradient(160deg,#1d2231,#11141c);border:1px solid #d8b45f55;border-radius:24px;padding:22px;margin-bottom:12px;box-shadow:0 14px 34px #0008}
.hero small{color:var(--mut);font-size:12px;letter-spacing:1.5px;text-transform:uppercase}
.big{font:700 40px/1.1 Georgia,serif;background:linear-gradient(180deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;margin-top:6px}
.big em{font:500 14px system-ui,sans-serif;font-style:normal;color:var(--mut);-webkit-text-fill-color:var(--mut);margin-left:8px}
.big.neg{background:linear-gradient(180deg,#ffb199,var(--red));-webkit-background-clip:text;background-clip:text}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.box{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--bd);border-radius:20px;padding:16px;box-shadow:0 8px 22px #0006}
.box small{color:var(--mut);font-size:12px;letter-spacing:1.5px;text-transform:uppercase}
.box .v{font:700 26px/1.2 Georgia,serif;color:var(--gold2);margin-top:6px}
.box .v.neg{color:var(--red)}.box .v.pos{color:var(--green)}
.dly{display:flex;gap:10px;align-items:center;margin-top:10px}
.dly input{font:700 20px Georgia,serif}
.dly span{color:var(--mut);white-space:nowrap;font-size:13px}
.ent{display:flex;gap:12px;align-items:center;background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--bd);border-radius:16px;padding:12px 16px;margin-bottom:10px;cursor:pointer;touch-action:manipulation}
.ent .t{flex:1;min-width:0}
.ent .t b{font-weight:600;font-size:15px;word-break:break-word}
.ent .t i{display:block;font-style:normal;font-size:12px;color:var(--mut);margin-top:2px}
.ent .a{font:700 18px Georgia,serif;white-space:nowrap}
.ent.in .a{color:var(--green)}.ent.out .a{color:var(--red)}
.ent.dpay .a{color:var(--green)}.ent.dadd .a{color:var(--red)}.ent.dinit .a{color:var(--gold2)}
.mic{width:52px;padding:0!important;border-radius:50%!important;font-size:20px;background:linear-gradient(135deg,#f3ce65,#d8ab32);color:#0a0a0d;border:0;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.mic.on{background:#ef4444;color:#fff;animation:pl 1s infinite}
@keyframes pl{50%{opacity:.6}}
#bUndo{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));z-index:20;color:var(--gold);border-color:#d8b45f77;background:#141821;box-shadow:0 8px 24px #000b;white-space:nowrap}
</style>
</head>
<body>

<header class="hd">
  <div class="hdi">
    <div class="crest">E</div>
    <div class="hdt"><h1>ESLATMA</h1><small>Aqlli yordamchi</small></div>
    <button id="bSet">⚙</button>
  </div>
  <div class="tabs">
    <button id="tN" class="on">Eslatmalar <span class="bdg" id="bdg">0</span></button>
    <button id="tF">Hisob</button>
  </div>
</header>

<main id="list"></main>
<main id="fin" hidden></main>

<div class="bar" id="barN">
  <input id="txt" placeholder="Yozing yoki mikrofonni bosing…">
  <button class="mic" id="mN">🎤</button>
  <button class="p" id="bGo">Saqlash</button>
</div>

<div class="bar fbar" id="barF" hidden>
  <div class="r">
    <button class="typeBtn on" data-type="in">+ Kirim</button>
    <button class="typeBtn" data-type="out">− Chiqim</button>
    <button class="typeBtn" data-type="dpay">Qarz</button>
  </div>
  <div class="r">
    <input id="aTxt" placeholder="Summa (ming so'm)…" inputmode="decimal">
    <button class="mic" id="mF">🎤</button>
    <button class="p" id="bAdd">Saqlash</button>
  </div>
</div>

<button id="bUndo" hidden>↩ Bekor qilish</button>
<div id="toast"></div>

<dialog id="dNote">
  <h3>Tahrirlash</h3>
  <label>Sarlavha</label><input id="fTitle">
  <label>Summa</label><input id="fAmt">
  <label>Vaqt</label><input id="fDate" type="datetime-local">
  <label>Turi</label>
  <select id="fCat"><option>Qarz</option><option>Ish</option><option>Eslatma</option></select>
  <div class="row"><button class="p" id="nSave">Saqlash</button></div>
  <div class="row"><button id="nDone">✓ Bajarildi</button><button class="d" id="nDel">O'chirish</button></div>
  <div class="row"><button id="nCancel">Yopish</button></div>
</dialog>

<dialog id="dFin">
  <h3>Yozuvni tahrirlash</h3>
  <label>Turi</label>
  <select id="eType">
    <option value="in">Kirim</option>
    <option value="out">Chiqim</option>
    <option value="dinit">Boshlang'ich qarz</option>
    <option value="dpay">Qarz to'lovi</option>
    <option value="dadd">Yangi qarz</option>
  </select>
  <label>Summa (ming so'm)</label><input id="eAmt" inputmode="decimal">
  <label>Izoh</label><input id="eNote">
  <label>Sana</label><input id="eDate" type="date">
  <div class="row"><button class="p" id="eSave">Saqlash</button></div>
  <div class="row"><button class="d" id="eDel">O'chirish</button><button id="eClose">Yopish</button></div>
</dialog>

<dialog id="dSet">
  <h3>Sozlamalar</h3>
  <label>Gemini API kaliti</label><input id="sKey" type="password" placeholder="AIza...">
  <div class="row"><button class="d" id="sClear">Hisobni tozalash</button></div>
  <div class="row"><button class="p" id="sClose">Yopish</button></div>
</dialog>

<script>
'use strict';

/* ============ STATE ============ */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const MON = ['yanvar','fevral','mart','aprel','may','iyun','iyul','avgust','sentyabr','oktyabr','noyabr','dekabr'];
const esc = t => { const d = document.createElement('div'); d.textContent = t == null ? '' : t; return d.innerHTML; };

let S = { notes: [], key: '', fin: { entries: [], daily: 150 } };
try { Object.assign(S, JSON.parse(localStorage.getItem('eslatma') || '{}')); } catch(e) {}
S.fin = S.fin || { entries: [], daily: 150 };
S.notes = S.notes || [];

let lastS = null;
let undoTimer = null;
let currentFinType = 'in';

function save() {
  try { localStorage.setItem('eslatma', JSON.stringify(S)); } catch(e) {}
}
function saveWithUndo() {
  lastS = JSON.parse(JSON.stringify(S));
  save();
  const btn = $('#bUndo');
  btn.hidden = false;
  clearTimeout(undoTimer);
  undoTimer = setTimeout(() => { btn.hidden = true; lastS = null; }, 6000);
}
function toast(m, ms) {
  const t = $('#toast');
  t.textContent = m;
  t.style.display = 'block';
  clearTimeout(toast.t);
  toast.t = setTimeout(() => t.style.display = 'none', ms || 3000);
}

/* ============ UTILS ============ */
function toLocal(d) {
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function fmtDate(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return `${d.getDate()} ${MON[d.getMonth()]}, ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function fmtDateShort(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()}`;
}
function dayTo(iso) {
  const d = new Date(iso); if (isNaN(d)) return 0;
  const now = new Date();
  const a = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const b = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((a - b) / 86400000);
}
function parts(iso) {
  const ms = new Date(iso) - Date.now();
  if (ms < 0) {
    const od = -dayTo(iso);
    return od >= 1 ? { n: od, u: "kun o'tdi", over: true } : { n: '!', u: "muddati o'tdi", over: true };
  }
  const m = Math.floor(ms / 60000), h = Math.floor(m / 60), d = dayTo(iso);
  if (d >= 1) return { n: d, u: 'kun qoldi', soon: d <= 1 };
  if (h >= 1) return { n: h, u: 'soat qoldi', soon: true };
  return { n: m, u: 'daqiqa qoldi', soon: true };
}

/* ============ DIALOG ============ */
function openD(d) {
  try { if (d.open) d.close(); d.showModal(); }
  catch(e) { d.setAttribute('open',''); d.classList.add('fb'); }
}
function closeD(d) {
  try { if (d.open) d.close(); } catch(e) {}
  d.removeAttribute('open');
}

/* ============ RENDER NOTES ============ */
function card(n) {
  const fin = n.done;
  const p = fin ? { n: '✓', u: 'bajarildi' } : parts(n.date);
  const dd = fin ? 9 : dayTo(n.date);
  const today = !fin && !p.over && dd === 0;
  const big = today ? 'BUGUN' : p.n;
  const lab = today ? p.n + ' ' + p.u : p.u;
  const cls = fin ? 'fin' : p.over ? 'over' : today ? 'today' : '';
  return `<div class="nc ${cls}" data-id="${n.id}">
    <div class="nb ${p.over?'o':''} ${String(big).length>3?'w':''}"><strong>${big}</strong><span>${lab}</span></div>
    <div class="nm">
      <div class="nr"><span class="chip">${esc(n.category)}</span>${n.amount ? `<span class="amt">${esc(n.amount)}</span>` : ''}</div>
      <div class="nt">${esc(n.title)}</div>
      <div class="nd">${esc(fmtDate(n.date))}</div>
    </div>
  </div>`;
}

function render() {
  const list = $('#list');
  if (!list) return;
  const act = S.notes.filter(n => !n.done).sort((a,b) => new Date(a.date) - new Date(b.date));
  const fin = S.notes.filter(n => n.done).sort((a,b) => new Date(b.date) - new Date(a.date));
  const bdg = $('#bdg');
  if (bdg) bdg.textContent = act.length;
  if (!S.notes.length) {
    list.innerHTML = `<div class="empty"><b>Bo'sh</b>Hozircha hech narsa yo'q.<br>Pastdan yangi eslatma qo'shing.</div>`;
    return;
  }
  let html = '';
  if (act.length) html += `<h2>Faol</h2>` + act.map(card).join('');
  if (fin.length) html += `<h2>Bajarilgan</h2>` + fin.map(card).join('');
  list.innerHTML = html;
}

/* ============ RENDER FINANCE ============ */
function calcFin() {
  const e = S.fin.entries;
  let inc = 0, out = 0, dinit = 0, dadd = 0, dpay = 0;
  for (const x of e) {
    const v = Number(x.amount) || 0;
    if (x.type === 'in') inc += v;
    else if (x.type === 'out') out += v;
    else if (x.type === 'dinit') dinit += v;
    else if (x.type === 'dadd') dadd += v;
    else if (x.type === 'dpay') dpay += v;
  }
  return { inc, out, debt: dinit + dadd - dpay, balance: inc - out };
}

function renderFin() {
  const fin = $('#fin');
  if (!fin) return;
  const { inc, out, debt, balance } = calcFin();
  const daily = Number(S.fin.daily) || 0;
  const daysLeft = 30 - new Date().getDate() + 1;
  const available = balance - debt;
  const dailySuggest = Math.max(0, Math.floor(available / daysLeft));

  const entries = S.fin.entries.slice().sort((a,b) => (b.date || '').localeCompare(a.date || ''));

  let entHtml = '';
  if (!entries.length) {
    entHtml = `<div class="empty"><b>Bo'sh</b>Hozircha yozuv yo'q.<br>Pastdan kirim yoki chiqim qo'shing.</div>`;
  } else {
    const typeLabel = { in: 'Kirim', out: 'Chiqim', dinit: "Boshl. qarz", dpay: "Qarz to'lovi", dadd: 'Yangi qarz' };
    entHtml = entries.map(x => {
      const sign = (x.type === 'in' || x.type === 'dpay') ? '+' : '−';
      return `<div class="ent ${x.type}" data-id="${x.id}">
        <div class="t"><b>${esc(x.note || typeLabel[x.type])}</b><i>${esc(typeLabel[x.type])} · ${esc(fmtDateShort(x.date))}</i></div>
        <div class="a">${sign}${esc(x.amount)}</div>
      </div>`;
    }).join('');
  }

  fin.innerHTML = `
    <div class="hero">
      <small>Umumiy balans</small>
      <div class="big ${balance < 0 ? 'neg' : ''}">${balance.toLocaleString('ru-RU')} <em>ming so'm</em></div>
      <div style="margin-top:10px;color:var(--mut);font-size:14px">
        Kuniga sarflash mumkin: <b style="color:var(--gold2)">${dailySuggest} ming</b>
      </div>
    </div>
    <div class="grid">
      <div class="box"><small>Kirim</small><div class="v pos">${inc.toLocaleString('ru-RU')}</div></div>
      <div class="box"><small>Chiqim</small><div class="v neg">${out.toLocaleString('ru-RU')}</div></div>
    </div>
    <div class="box">
      <small>Qarz (siz to'lashingiz kerak)</small>
      <div class="v ${debt > 0 ? 'neg' : ''}">${debt.toLocaleString('ru-RU')}</div>
      <div class="dly">
        <span>Kunlik limit:</span>
        <input type="number" id="fDaily" value="${daily}" inputmode="numeric">
        <span>ming</span>
      </div>
    </div>
    <h2>Oxirgi yozuvlar</h2>
    ${entHtml}
  `;

  const dailyInp = $('#fDaily');
  if (dailyInp) {
    dailyInp.addEventListener('change', () => {
      S.fin.daily = Number(dailyInp.value) || 0;
      save();
      toast('Limit saqlandi');
    });
  }
}

/* ============ NOTE DIALOG ============ */
function openNote(id) {
  const n = S.notes.find(x => String(x.id) === String(id));
  if (!n) return;
  const d = $('#dNote');
  d.dataset.editId = id;
  $('#fTitle').value = n.title || '';
  $('#fAmt').value = n.amount || '';
  $('#fDate').value = n.date || '';
  $('#fCat').value = n.category || 'Eslatma';
  openD(d);
}

function nSave() {
  const d = $('#dNote');
  const n = S.notes.find(x => String(x.id) === String(d.dataset.editId));
  if (!n) return closeD(d);
  n.title = $('#fTitle').value.trim();
  n.amount = $('#fAmt').value.trim();
  n.date = $('#fDate').value;
  n.category = $('#fCat').value;
  saveWithUndo();
  render();
  closeD(d);
  toast('Saqlandi');
}

/* ============ FIN DIALOG ============ */
function openFin(id) {
  const x = S.fin.entries.find(e => String(e.id) === String(id));
  if (!x) return;
  const d = $('#dFin');
  d.dataset.editId = id;
  $('#eType').value = x.type;
  $('#eAmt').value = x.amount;
  $('#eNote').value = x.note || '';
  $('#eDate').value = x.date || new Date().toISOString().slice(0,10);
  openD(d);
}

function eSave() {
  const d = $('#dFin');
