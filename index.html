<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>Eslatma</title>
<style>
html{background:#0b0d12}
:root{--bg:#0b0d12;--card:#141821;--card2:#10131a;--tx:#f3efe6;--mut:#8d93a1;--gold:#d8b45f;--gold2:#f2d98f;--bd:#262c38;--red:#ef6b6b;--green:#6fcf97;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(1200px 500px at 50% -200px,#1b2030 0,var(--bg) 70%) fixed;color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding-top:env(safe-area-inset-top)}
button{font:inherit;cursor:pointer;border-radius:14px;padding:11px 16px;background:var(--card);color:var(--tx);border:1px solid var(--bd)}
button.p{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#2a2008;border:0;font-weight:700;box-shadow:0 6px 18px #d8b45f33}
button.d{color:var(--red)}
main{padding:8px 16px 130px;max-width:600px;margin:auto}
.bar{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 35%);padding:26px 14px calc(14px + env(safe-area-inset-bottom));display:flex;gap:10px;max-width:600px;margin:auto;z-index:50}
.bar input{flex:1;min-width:0;border-radius:26px;padding:15px 20px;border-color:#d8b45f44;box-shadow:0 8px 24px #0008;background:#0e1118;color:var(--tx);border:1px solid var(--bd);font-size:16px}
.bar button{border-radius:26px;padding:0 24px}
input:focus,select:focus{outline:0;border-color:var(--gold)}
dialog{border:1px solid #d8b45f44;border-radius:24px;padding:22px;width:min(92vw,420px);background:linear-gradient(160deg,#171c27,#0f1219);color:var(--tx);box-shadow:0 30px 80px #000c}
dialog::backdrop{background:#000b;backdrop-filter:blur(3px)}
dialog h3{margin:0;font:600 22px Georgia,serif;color:var(--gold2)}
dialog label{display:block;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);margin:14px 0 6px}
.row{display:flex;gap:8px;margin-top:16px}.row button{flex:1}
input,select{font:inherit;width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--bd);background:#0e1118;color:var(--tx)}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:linear-gradient(135deg,var(--gold2),var(--gold));color:#2a2008;font-weight:600;padding:12px 18px;border-radius:16px;display:none;z-index:99;max-width:90vw;box-shadow:0 10px 30px #000a}
[hidden]{display:none!important}
header.hd{position:sticky;top:0;z-index:40;display:block;max-width:none;margin:0;padding:10px 16px 10px;background:#0a0a0ef2;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid #d4af3740}
.hdi{max-width:600px;margin:0 auto;display:flex;align-items:center;justify-content:center;position:relative;gap:10px}
.crest{width:38px;height:38px;border-radius:12px;background:#17171f;border:1px solid #d4af3766;display:flex;align-items:center;justify-content:center;font:700 20px Georgia,serif;color:var(--gold2);box-shadow:0 4px 14px #d4af3722}
.hdt h1{font:800 17px/1 Georgia,serif;letter-spacing:2px;margin:0}
.hdt small{display:block;margin:4px 0 0;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#a0a0a8}
header.hd #bSet{position:absolute;right:0;top:0;width:38px;height:38px;padding:0;border-radius:50%}
header.hd .tabs{max-width:600px;margin:10px auto 0;padding:4px;gap:4px;background:#121217;border:1px solid #d4af3733;border-radius:16px;display:flex}
.tabs button{flex:1;border:0;background:transparent;border-radius:12px;padding:9px 6px;font-weight:600;color:#a0a0a8}
.tabs button.on{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#0a0a0d}
.bdg{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:99px;background:#000;color:#e8c45a;font-size:12px}
.mic{width:52px;padding:0!important;border-radius:50%!important;font-size:20px;background:linear-gradient(135deg,#f3ce65,#d8ab32 50%,#ab7f18);color:#0a0a0d;border:0;box-shadow:0 4px 15px #d4af374d;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .15s}
.mic.on{background:#ef4444;color:#fff;transform:scale(1.28);animation:pl 1s infinite}
@keyframes pl{50%{opacity:.6}}
.it{display:flex;gap:14px;align-items:center;background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--bd);border-radius:20px;padding:16px 18px;margin-bottom:12px;cursor:pointer}
.it .t{flex:1;min-width:0}
.it .tt{font-size:17px;font-weight:600}
.it .num{text-align:center;min-width:76px;line-height:1}
.it .num strong{display:block;font:700 44px/1 Georgia,serif;color:var(--gold2)}
.it .num span{display:block;margin-top:6px;font-size:12px;color:var(--mut)}
.empty{color:var(--mut);text-align:center;padding:60px 20px;}
.empty b{display:block;font:600 22px Georgia,serif;color:var(--gold);margin-bottom:6px}
dialog.fb[open]{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:100;max-height:90vh;overflow:auto}
</style>
</head>
<body>
<header class="hd">
  <div class="hdi">
    <div class="crest">E</div>
    <div class="hdt"><h1>ESLATMA</h1><small>Aqlli yordamchi</small></div>
    <button id="bSet">&#x2699;</button>
  </div>
  <div class="tabs">
    <button id="tN" class="on">Eslatmalar<span class="bdg" id="bdg">0</span></button>
    <button id="tF">Hisob</button>
  </div>
</header>

<main id="list"></main>
<main id="fin" hidden></main>

<div class="bar" id="barN">
  <input id="txt" placeholder="Yozing yoki mikrofonni bosib turing…">
  <button class="mic" id="mN">&#x1F3A4;</button>
  <button class="p" id="bGo">Saqlash</button>
</div>
<div class="bar" id="barF" hidden>
  <input id="aTxt" placeholder="Pulni yozing yoki mikrofonni bosib turing…">
  <button class="mic" id="mF">&#x1F3A4;</button>
  <button class="p" id="bAdd">Saqlash</button>
</div>

<div id="toast"></div>

<dialog id="dNote">
  <h3>Tahrirlash</h3>
  <label>Sarlavha</label><input id="fTitle">
  <label>Summa</label><input id="fAmt">
  <label>Eslatma vaqti</label><input id="fDate" type="datetime-local">
  <label>Turi</label>
  <select id="fCat"><option>Qarz</option><option>Ish</option><option>Eslatma</option></select>
  <div class="row"><button class="p" id="nSave">Saqlash</button></div>
  <div class="row" style="margin-top:8px"><button id="nDone">✓ Bajarildi</button><button class="d" id="nDel">Oʻchirish</button></div>
  <div class="row" style="margin-top:8px"><button id="nCancel">Yopish</button></div>
</dialog>

<dialog id="dSet">
  <h3>Sozlamalar</h3>
  <label>Gemini API kaliti</label><input id="sKey" type="password" placeholder="AQ.Ab8...">
  <div class="row"><button class="p" id="sClose">Yopish</button></div>
</dialog>

<script>
// Xatolarni ushlash (Checkpoints)
(function(){
  var box;
  function show(t){
    if (!box){ box = document.createElement('div'); box.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:999;pointer-events:none'; (document.body || document.documentElement).appendChild(box); }
    var d = document.createElement('div'); d.style.cssText = 'background:#b00020;color:#fff;padding:6px 8px;font:12px monospace;border-bottom:1px solid #fff';
    d.appendChild(document.createTextNode(t)); box.appendChild(d); }
  window.addEventListener('error', function(e){ show('XATO: ' + e.message + ' [qator ' + (e.lineno || '?') + ']'); });
  window.addEventListener('unhandledrejection', function(e){ show('XATO (promise): ' + ((e.reason && e.reason.message) || e.reason)); });
  setTimeout(function(){ if (!window.__eslatmaOK) show('Dastur toliq ishga tushmadi. Oxirgi bosqich: ' + (window.__step === undefined ? 'BOSHLANMAGAN' : window.__step)); }, 2500);
})();

window.__step = 1;
const $ = (s) => document.querySelector(s);
const CATS = ["Qarz", "Ish", "Eslatma"];
const MON = ["yanvar", "fevral", "mart", "aprel", "may", "iyun", "iyul", "avgust", "sentyabr", "oktyabr", "noyabr", "dekabr"];
let S = { notes: [], key: "AQ.Ab8RN6IYNWt7q-VrEnnai7sbTJK5i2SQbNkt76XuSX2WOPZbGw" };

try { Object.assign(S, JSON.parse(localStorage.getItem("eslatma") || "{}")); } catch (e) {}

window.__step = 2;
S.fin = S.fin || { entries: [] };

const save = () => { try { localStorage.setItem("eslatma", JSON.stringify(S)); } catch (e) {} };
const pad = (n) => String(n).padStart(2, "0");
const toLocal = (d) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;

function toast(m, ms) {
  const t = $("#toast"); t.textContent = m; t.style.display = "block";
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = "none", ms || 4000);
}

function openD(d) { if(d.showModal) d.showModal(); else d.classList.add("fb"); d.setAttribute("open",""); }
function closeD(d) { if(d.close) d.close(); d.removeAttribute("open"); d.classList.remove("fb"); }

// Render
function render() {
  const act = S.notes.filter(n => !n.done);
  $("#bdg").textContent = act.length;
  let h = "";
  if (!S.notes.length) h = '<div class="empty"><b>Hozircha boʻsh</b>Pastga yozing yoki mikrofonni ushlab turing.</div>';
  else {
    h = S.notes.map(n => `
      <div class="it" data-id="${n.id}">
        <div class="t"><div class="tt">${n.title || 'Eslatma'}</div><div class="dt" style="font-size:12px;color:#8d93a1">${n.category}</div></div>
        <div class="num"><strong>${n.amount || ''}</strong><span>${n.date.slice(11,16)}</span></div>
      </div>
    `).join('');
  }
  $("#list").innerHTML = h;
  window.__step = 3;
}

// Gemini
async function callGemini(prompt, base64Audio) {
  const parts = [];
  if (base64Audio) parts.push({ inline_data: { mime_type: 'audio/webm', data: base64Audio } });
  parts.push({ text: prompt });
  const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${encodeURIComponent(S.key)}`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({contents:[{parts: parts}], generationConfig:{responseMimeType:'application/json', temperature:0}})
  });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error?.message || 'API xato');
  return JSON.parse(j.candidates[0].content.parts[0].text.replace(/```json|```/g,'').trim());
}

async function analyzeAndSave(text, base64Audio) {
  if (!S.key) { toast('API kalit yo\'q!'); return; }
  toast('⏳ AI tahlil qilmoqda...', 2000);
  const prompt = `Hozirgi vaqt: ${toLocal(new Date())}. ${base64Audio ? 'Ovozni tingla.' : ''} FAQAT JSON qaytar:
  {"title":"qisqa sarlavha", "amount":"summa", "target_date":"YYYY-MM-DDTHH:mm", "category":"Qarz | Ish | Eslatma"}`;
  try {
    const o = await callGemini(prompt + (text ? ` Matn: "${text}"` : ''), base64Audio);
    S.notes.push({ id: Date.now().toString(), title: o.title || text, amount: o.amount || '', date: o.target_date || toLocal(new Date()), category: o.category || 'Eslatma', done: false });
    save(); render(); $("#txt").value = '';
    toast('✓ Saqlandi!');
  } catch(e) { toast('Xato: ' + e.message); }
}

// Mikrofon (Push-to-Talk)
let mediaRecorder, audioChunks = [], isRecording = false, recType = null;

async function startRecording(btn, type) {
  if (isRecording) return;
  recType = type;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = []; isRecording = true;
    btn.classList.add('on'); toast('🎤 Gapiring...', 2000);

    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.onstop = () => {
      const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
      const reader = new FileReader();
      reader.readAsDataURL(audioBlob);
      reader.onloadend = () => {
        const base64data = reader.result.split(',')[1];
        analyzeAndSave('', base64data);
      };
      stream.getTracks().forEach(track => track.stop());
      btn.classList.remove('on'); isRecording = false;
    };
    mediaRecorder.start();

    const stopHandler = () => {
      if (isRecording && mediaRecorder.state === 'recording') mediaRecorder.stop();
      ['touchend','touchcancel','mouseup','mouseleave'].forEach(ev => btn.removeEventListener(ev, stopHandler));
    };
    ['touchend','touchcancel','mouseup','mouseleave'].forEach(ev => btn.addEventListener(ev, stopHandler));
  } catch (err) { toast('❌ Mikrofon ruxsati yo\'q!', 3000); btn.classList.remove('on'); isRecording = false; }
}

window.__step = 4;

// Hodisalar
$('#tN').onclick = () => { $('#tN').classList.add('on'); $('#tF').classList.remove('on'); $('#list').hidden=false; $('#barN').hidden=false; $('#fin').hidden=true; $('#barF').hidden=true; };
$('#tF').onclick = () => { $('#tF').classList.add('on'); $('#tN').classList.remove('on'); $('#list').hidden=true; $('#barN').hidden=true; $('#fin').hidden=false; $('#barF').hidden=false; };

$('#bGo').onclick = () => { const t = $('#txt').value.trim(); if (t) analyzeAndSave(t, null); };

const mN = $('#mN');
mN.addEventListener('touchstart', (e) => { e.preventDefault(); startRecording(mN, 'note'); }, {passive: false});
mN.addEventListener('mousedown', (e) => { e.preventDefault(); startRecording(mN, 'note'); });

$('#bSet').onclick = () => { $('#sKey').value = S.key; openD($('#dSet')); };
$('#sClose').onclick = () => { S.key = $('#sKey').value.trim(); save(); closeD($('#dSet')); };

let editing = null;
$('#list').onclick = e => {
  const el = e.target.closest('.it'); if (!el) return;
  const n = S.notes.find(x => x.id === el.dataset.id); if (!n) return;
  editing = n; $('#fTitle').value = n.title; $('#fAmt').value = n.amount; $('#fDate').value = n.date.slice(0,16); $('#fCat').value = n.category;
  openD($('#dNote'));
};
$('#nSave').onclick = () => { Object.assign(editing, {title:$('#fTitle').value.trim(), amount:$('#fAmt').value.trim(), date:$('#fDate').value, category:$('#fCat').value}); save(); render(); closeD($('#dNote')); };
$('#nDone').onclick = () => { editing.done = !editing.done; save(); render(); closeD($('#dNote')); };
$('#nDel').onclick = () => { if (confirm('Oʻchirilsinmi?')) { S.notes = S.notes.filter(x => x !== editing); save(); render(); closeD($('#dNote')); } };
$('#nCancel').onclick = () => closeD($('#dNote'));

window.__step = 99;
render();
window.__eslatmaOK = true; // Xato chiqmasligi uchun
</script>
</body>
</html>
